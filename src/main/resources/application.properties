spring.application.name=healthcare-consent-gateway

# 授权判定规则版本（调整规则时递增，审计记录会携带该版本以便复现）
# consent-rules-v1: 整体允许/拒绝；consent-rules-v2: 支持数据维度级授权（部分可见）
gateway.consent.rule-version=consent-rules-v2

# 脱敏策略版本与字段规则：FULL=全打码, PARTIAL=保留首尾, HASH=SHA-256 摘要
gateway.masking.version=masking-v1
gateway.masking.fields.name=PARTIAL
gateway.masking.fields.idNumber=HASH
gateway.masking.fields.phone=PARTIAL
gateway.masking.fields.email=PARTIAL
gateway.masking.fields.address=FULL
gateway.masking.fields.lastName=PARTIAL
gateway.masking.fields.firstName=PARTIAL
gateway.masking.fields.areaCode=PARTIAL
gateway.masking.fields.phoneNumber=PARTIAL
gateway.masking.fields.province=PARTIAL
gateway.masking.fields.city=HASH
gateway.masking.fields.street=FULL

# 拼接字段：成分先各自按上面的规则脱敏，脱敏结果再按序组合（separator 可配）
gateway.masking.composites.fullName=lastName,firstName
gateway.masking.composites.contactPhone=areaCode,phoneNumber
gateway.masking.composites.contactPhone.separator=-
gateway.masking.composites.fullAddress=province,city,street
