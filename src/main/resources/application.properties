spring.application.name=healthcare-consent-gateway

# 授权判定规则版本（可选 consent-rules-v1 / consent-rules-v2；调整规则时发布新版本，
# 审计记录会携带判定时的版本以便历史复现）
gateway.consent.rule-version=consent-rules-v1

# 脱敏策略版本（内置 masking-v0 全打码 / masking-v1 默认 / masking-v2 已预置可发布）
gateway.masking.version=masking-v1
# 常规字段：FULL=全打码, PARTIAL=保留首尾, HASH=SHA-256 摘要
gateway.masking.fields.name=PARTIAL
gateway.masking.fields.idNumber=HASH
gateway.masking.fields.phone=PARTIAL
gateway.masking.fields.email=PARTIAL
gateway.masking.fields.address=FULL
# 拼接字段成分（先各自脱敏再拼接）：
# fullName      = firstName + 空格 + lastName
# contactPhone  = areaCode(HASH) + "-" + contactNumber(PARTIAL)
# fullAddress   = country + city + district + street（无分隔符）
gateway.masking.fields.firstName=PARTIAL
gateway.masking.fields.lastName=PARTIAL
gateway.masking.fields.areaCode=HASH
gateway.masking.fields.contactNumber=PARTIAL
gateway.masking.fields.country=PARTIAL
gateway.masking.fields.city=PARTIAL
gateway.masking.fields.district=PARTIAL
gateway.masking.fields.street=PARTIAL
